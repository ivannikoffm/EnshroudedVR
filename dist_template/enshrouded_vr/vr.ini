[vr]
; OpenXR runtime: auto = active runtime, then Meta Link, Virtual Desktop... | or meta / vd / steamvr / pico / active / full path to runtime .json
xr_runtime=auto
stereo=1
ipd_pct=100
cam_dist_pct=100
head_look=1
head_pos=0
fov_override=1
fov_axis=0
fov_pct=100
hud_mode=1
hud_dist_cm=150
hud_sync=1
head_tracking=1
head_mode=1
pair_lock=1
pair_rate=0
pose_lag=2
yaw_sign=1
pitch_sign=1
roll_sign=0
fov_mode=1
fov_off=0x0
mat_proj=1
; 1 = fit the image to each eye's lens (required for Quest 3 and other angled-lens headsets)
layer_eyefov=1
; game frame size forced by the mod: WxH or 0 = off. Needs the game in Windowed display mode. Square = ~33% sharper
force_window=2160x2160
pose_log=0
[keys]
recenter=Home
ipd_up=Num+
ipd_down=Num-
ipd_up_alt=]
ipd_down_alt=[
ipd_reset=Num0
cam_closer=Num4
cam_farther=Num6
cam_reset=Num3
hud_mode=NumDel
fov_toggle=Num*
fov_fill_fit=Num/
head_look=Num5
six_dof=Num8
toggle_tracking=Insert
stereo_mode=ScrollLock
yaw_sign=None
camobj_dump=None
roll_mode=None
pose_lag=None
pitch_sign=None
fov_hwbp=None
pair_lock=None
pair_rate=None
